<!doctype html>
<!--
  Static API reference, published to GitHub Pages by .github/workflows/pages.yml.
  The workflow copies the committed openapi.yml next to this page, so this page
  always shows exactly what CI has checked is current. Nothing is generated here.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GCP Resource Explorer API</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
  <style>body { margin: 0; background: #fafafa; }</style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: "openapi.yml",
      dom_id: "#swagger-ui",
      deepLinking: true,
      // A static page has no server behind it, so "Try it out" could only fail.
      // Run `gcp-explorer serve` and use /docs for a live, executable version.
      supportedSubmitMethods: [],
    });
  </script>
</body>
</html>
