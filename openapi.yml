openapi: 3.1.0
info:
  title: GCP Resource Explorer API
  description: Search Google Cloud resources across a project, folder, or organization
    via Cloud Asset Inventory.
  version: 0.1.0
paths:
  /v1/resources:
    get:
      summary: Search resources in a scope
      operationId: search_resources_v1_resources_get
      parameters:
      - name: scope
        in: query
        required: true
        schema:
          type: string
          description: 'CAI scope: organizations/<id>, folders/<id>, or projects/<id>'
          examples:
          - projects/my-project
          title: Scope
        description: 'CAI scope: organizations/<id>, folders/<id>, or projects/<id>'
      - name: type
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: 'Resource type, repeatable. A friendly name, a raw CAI asset
            type, or an RE2 pattern. Friendly names: address, bucket, cloudrun, dataset,
            disk, firewall, forwardingrule, function, gke, network, project, secret,
            serviceaccount, spanner, sql, subnet, subscription, table, topic, vm.'
          examples:
          - - bucket
          title: Type
        description: 'Resource type, repeatable. A friendly name, a raw CAI asset
          type, or an RE2 pattern. Friendly names: address, bucket, cloudrun, dataset,
          disk, firewall, forwardingrule, function, gke, network, project, secret,
          serviceaccount, spanner, sql, subnet, subscription, table, topic, vm.'
      - name: q
        in: query
        required: false
        schema:
          type: string
          description: Free-text term, matched across all searchable fields
          default: ''
          title: Q
        description: Free-text term, matched across all searchable fields
      - name: label
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: 'Label filter, repeatable: `key=value`, or `key` to match any
            value'
          examples:
          - - env=prod
          title: Label
        description: 'Label filter, repeatable: `key=value`, or `key` to match any
          value'
      - name: location
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Location filter, repeatable; several are ORed. Supports `*`
            wildcards.
          examples:
          - - europe-west2
          title: Location
        description: Location filter, repeatable; several are ORed. Supports `*` wildcards.
      - name: project
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Project filter, repeatable; several are ORed. Accepts a project
            ID or number (IDs are resolved to numbers, which is what CAI matches on).
          title: Project
        description: Project filter, repeatable; several are ORed. Accepts a project
          ID or number (IDs are resolved to numbers, which is what CAI matches on).
      - name: raw_query
        in: query
        required: false
        schema:
          type: string
          description: Raw CAI query syntax, ANDed with the other filters
          default: ''
          title: Raw Query
        description: Raw CAI query syntax, ANDed with the other filters
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 10000
          minimum: 1
          description: Maximum resources to return
          default: 1000
          title: Limit
        description: Maximum resources to return
      - name: show_all
        in: query
        required: false
        schema:
          type: boolean
          description: Include resources hidden by default (enabled API services,
            image layers, auto-created default routes and subnets, and similar)
          default: false
          title: Show All
        description: Include resources hidden by default (enabled API services, image
          layers, auto-created default routes and subnets, and similar)
      - name: sort
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: 'Sort field, with optional ` DESC`. Repeatable for tie-breaks.
            One of: name, assetType, project, displayName, description, location,
            createTime, updateTime, state, parentFullResourceName, parentAssetType.'
          examples:
          - - name
          title: Sort
        description: 'Sort field, with optional ` DESC`. Repeatable for tie-breaks.
          One of: name, assetType, project, displayName, description, location, createTime,
          updateTime, state, parentFullResourceName, parentAssetType.'
      - name: include_iam
        in: query
        required: false
        schema:
          type: boolean
          description: Attach each resource's directly-attached IAM bindings. One
            extra call for the whole scope. Inherited bindings are not included.
          default: false
          title: Include Iam
        description: Attach each resource's directly-attached IAM bindings. One extra
          call for the whole scope. Inherited bindings are not included.
      - name: cache_ttl
        in: query
        required: false
        schema:
          type: number
          maximum: 3600
          minimum: 0
          description: Seconds to cache identical searches. 0 (the default) disables
            it -- an audit tool should not answer from a stale cache unless asked
            to.
          default: 0.0
          title: Cache Ttl
        description: Seconds to cache identical searches. 0 (the default) disables
          it -- an audit tool should not answer from a stale cache unless asked to.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList'
        '400':
          description: Unknown type, malformed scope or filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller lacks Cloud Asset Viewer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Scope not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Cloud Asset Inventory call failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Cloud Asset API not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/resources/stream:
    get:
      summary: Stream resources as newline-delimited JSON
      description: 'One JSON object per line, emitted as CAI returns them.


        For result sets large enough that waiting for the whole payload is worse

        than parsing incrementally. Unlike `/v1/resources` this does not report

        suppression counts -- they are not known until the stream ends, and a

        trailer would be missed by most clients. Use `/v1/summary` for totals.'
      operationId: stream_resources_v1_resources_stream_get
      parameters:
      - name: scope
        in: query
        required: true
        schema:
          type: string
          description: 'CAI scope: organizations/<id>, folders/<id>, or projects/<id>'
          examples:
          - organizations/123
          title: Scope
        description: 'CAI scope: organizations/<id>, folders/<id>, or projects/<id>'
      - name: type
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Resource type, repeatable. A friendly name, a raw CAI asset
            type, or an RE2 pattern.
          title: Type
        description: Resource type, repeatable. A friendly name, a raw CAI asset type,
          or an RE2 pattern.
      - name: q
        in: query
        required: false
        schema:
          type: string
          description: Free-text term, matched across all searchable fields
          default: ''
          title: Q
        description: Free-text term, matched across all searchable fields
      - name: label
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: 'Label filter, repeatable: `key=value`, or `key` to match any
            value'
          title: Label
        description: 'Label filter, repeatable: `key=value`, or `key` to match any
          value'
      - name: location
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Location filter, repeatable; several are ORed. Supports `*`
            wildcards.
          title: Location
        description: Location filter, repeatable; several are ORed. Supports `*` wildcards.
      - name: project
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Project filter, repeatable; several are ORed. Accepts a project
            ID or number (IDs are resolved to numbers, which is what CAI matches on).
          title: Project
        description: Project filter, repeatable; several are ORed. Accepts a project
          ID or number (IDs are resolved to numbers, which is what CAI matches on).
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: Maximum resources to return
          title: Limit
        description: Maximum resources to return
      - name: show_all
        in: query
        required: false
        schema:
          type: boolean
          description: Include resources hidden by default (enabled API services,
            image layers, auto-created default routes and subnets, and similar)
          default: false
          title: Show All
        description: Include resources hidden by default (enabled API services, image
          layers, auto-created default routes and subnets, and similar)
      - name: sort
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: 'Sort field, with optional ` DESC`. Repeatable for tie-breaks.
            One of: name, assetType, project, displayName, description, location,
            createTime, updateTime, state, parentFullResourceName, parentAssetType.'
          title: Sort
        description: 'Sort field, with optional ` DESC`. Repeatable for tie-breaks.
          One of: name, assetType, project, displayName, description, location, createTime,
          updateTime, state, parentFullResourceName, parentAssetType.'
      responses:
        '200':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/summary:
    get:
      summary: Counts by type, project and location for a scope
      description: 'Aggregate a whole scope into one payload.


        No `limit`: a summary of a truncated result set would be a lie, so this

        always counts everything matching.'
      operationId: summary_v1_summary_get
      parameters:
      - name: scope
        in: query
        required: true
        schema:
          type: string
          description: 'CAI scope: organizations/<id>, folders/<id>, or projects/<id>'
          examples:
          - organizations/123
          title: Scope
        description: 'CAI scope: organizations/<id>, folders/<id>, or projects/<id>'
      - name: type
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Resource type, repeatable. A friendly name, a raw CAI asset
            type, or an RE2 pattern.
          title: Type
        description: Resource type, repeatable. A friendly name, a raw CAI asset type,
          or an RE2 pattern.
      - name: q
        in: query
        required: false
        schema:
          type: string
          description: Free-text term, matched across all searchable fields
          default: ''
          title: Q
        description: Free-text term, matched across all searchable fields
      - name: label
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: 'Label filter, repeatable: `key=value`, or `key` to match any
            value'
          title: Label
        description: 'Label filter, repeatable: `key=value`, or `key` to match any
          value'
      - name: location
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Location filter, repeatable; several are ORed. Supports `*`
            wildcards.
          title: Location
        description: Location filter, repeatable; several are ORed. Supports `*` wildcards.
      - name: project
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Project filter, repeatable; several are ORed. Accepts a project
            ID or number (IDs are resolved to numbers, which is what CAI matches on).
          title: Project
        description: Project filter, repeatable; several are ORed. Accepts a project
          ID or number (IDs are resolved to numbers, which is what CAI matches on).
      - name: show_all
        in: query
        required: false
        schema:
          type: boolean
          description: Include resources hidden by default (enabled API services,
            image layers, auto-created default routes and subnets, and similar)
          default: false
          title: Show All
        description: Include resources hidden by default (enabled API services, image
          layers, auto-created default routes and subnets, and similar)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
        '400':
          description: Unknown type, malformed scope or filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller lacks Cloud Asset Viewer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Scope not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Cloud Asset API not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/roles:
    get:
      summary: List IAM roles classed as risky
      description: 'Predefined roles containing at least one permission at or above
        `risk`.


        A role''s risk is the highest risk of any permission it contains. Each

        permission carries its reason and source ids; `sources` quotes each source.'
      operationId: list_roles_v1_roles_get
      parameters:
      - name: risk
        in: query
        required: false
        schema:
          type: string
          description: 'Lowest role risk to include: `high`, or `medium` for medium
            and high'
          examples:
          - high
          default: high
          title: Risk
        description: 'Lowest role risk to include: `high`, or `medium` for medium
          and high'
      - name: show_all
        in: query
        required: false
        schema:
          type: boolean
          description: Include Google-managed service agents, hidden by default
          default: false
          title: Show All
        description: Include Google-managed service agents, hidden by default
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleList'
        '400':
          description: Unknown risk level
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: IAM role listing failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: IAM API not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/grants:
    get:
      summary: Find principals holding risky roles
      description: 'Every principal holding a role at or above `role_risk`, matched
        by permission.


        Read `coverage_note`: a project or folder scope cannot see grants made

        above it, billing account IAM is not included, and groups are not expanded.'
      operationId: list_grants_v1_grants_get
      parameters:
      - name: scope
        in: query
        required: true
        schema:
          type: string
          description: 'CAI scope: organizations/<id>, folders/<id>, or projects/<id>'
          examples:
          - organizations/123
          title: Scope
        description: 'CAI scope: organizations/<id>, folders/<id>, or projects/<id>'
      - name: role_risk
        in: query
        required: false
        schema:
          type: string
          description: 'Lowest role risk to include: `high`, or `medium` for medium
            and high'
          examples:
          - high
          default: high
          title: Role Risk
        description: 'Lowest role risk to include: `high`, or `medium` for medium
          and high'
      - name: member_type
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: 'Principal type to include, repeatable: user, group, serviceAccount,
            domain, allUsers, allAuthenticatedUsers, principal, principalSet. Omit
            for all.'
          examples:
          - - user
            - group
          title: Member Type
        description: 'Principal type to include, repeatable: user, group, serviceAccount,
          domain, allUsers, allAuthenticatedUsers, principal, principalSet. Omit for
          all.'
      - name: group_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Roll grants up by `member` (who holds what) or `role` (who
            holds each role)
          examples:
          - member
          title: Group By
        description: Roll grants up by `member` (who holds what) or `role` (who holds
          each role)
      - name: show_all
        in: query
        required: false
        schema:
          type: boolean
          description: Include Google-managed service agents, hidden by default
          default: false
          title: Show All
        description: Include Google-managed service agents, hidden by default
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 10000
          minimum: 1
          description: Maximum resources to return
          default: 1000
          title: Limit
        description: Maximum resources to return
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantList'
        '400':
          description: Bad scope, risk, member type or group_by
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller lacks Cloud Asset Viewer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Scope not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Cloud Asset Inventory call failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Cloud Asset API not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/types:
    get:
      summary: List supported resource-type names
      description: 'Friendly names mapped to CAI asset types.


        Raw CAI asset types are accepted anywhere a friendly name is, so this is a

        convenience listing rather than the set of what can be searched.'
      operationId: list_types_v1_types_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response List Types V1 Types Get
components:
  schemas:
    ErrorResponse:
      properties:
        error:
          type: string
          title: Error
          description: Machine-readable error code
        detail:
          type: string
          title: Detail
          description: Human-readable explanation
      type: object
      required:
      - error
      - detail
      title: ErrorResponse
      description: Body returned with any non-2xx status.
    Grant:
      properties:
        resource:
          type: string
          title: Resource
          description: Full resource name the policy is attached to
        asset_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Asset Type
          description: CAI asset type of that resource
        role:
          type: string
          title: Role
          description: Role granted
        member:
          type: string
          title: Member
          description: Principal, e.g. user:a@example.com or group:ops@example.com
        member_type:
          type: string
          title: Member Type
          description: user, group, serviceAccount, domain, allUsers, ...
        risk:
          type: string
          title: Risk
          description: Highest risk among the matched permissions
        matched_permissions:
          items:
            type: string
          type: array
          title: Matched Permissions
          description: Risky permissions in this role that the search matched
        condition:
          anyOf:
          - type: string
          - type: 'null'
          title: Condition
          description: IAM condition expression, when the binding is conditional
      type: object
      required:
      - resource
      - role
      - member
      - member_type
      - risk
      - matched_permissions
      title: Grant
      description: One principal holding one risky role on one resource.
    GrantGroup:
      properties:
        key:
          type: string
          title: Key
          description: The member or role grouped on
        highest_risk:
          type: string
          title: Highest Risk
        grant_count:
          type: integer
          title: Grant Count
        resource_count:
          type: integer
          title: Resource Count
          description: Distinct resources involved
        roles:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Roles
          description: Roles held (grouping by member)
        members:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Members
          description: Holders (grouping by role)
      type: object
      required:
      - key
      - highest_risk
      - grant_count
      - resource_count
      title: GrantGroup
      description: Grants rolled up by member or by role, for an over-permissioning
        review.
    GrantList:
      properties:
        scope:
          type: string
          title: Scope
        min_risk:
          type: string
          title: Min Risk
          description: Lowest role risk included
        member_types:
          items:
            type: string
          type: array
          title: Member Types
          description: Member types searched; empty means all
        queries:
          items:
            type: string
          type: array
          title: Queries
          description: The CAI queries sent, one per batch of permissions. CAI caps
            the alternations in a single query, so a long permission list is searched
            in batches.
        count:
          type: integer
          title: Count
        truncated:
          type: boolean
          title: Truncated
        suppressed:
          type: integer
          title: Suppressed
          description: Service-agent grants hidden by default; show_all=true includes
            them
          default: 0
        suppressed_summary:
          type: string
          title: Suppressed Summary
          default: ''
        coverage_note:
          type: string
          title: Coverage Note
          description: What this search cannot see. Read it before treating the list
            as complete.
        grants:
          items:
            $ref: '#/components/schemas/Grant'
          type: array
          title: Grants
        groups:
          anyOf:
          - items:
              $ref: '#/components/schemas/GrantGroup'
            type: array
          - type: 'null'
          title: Groups
          description: Present when group_by was requested
      type: object
      required:
      - scope
      - min_risk
      - member_types
      - queries
      - count
      - truncated
      - coverage_note
      - grants
      title: GrantList
      description: Envelope returned by a high-risk grant search.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IamBinding:
      properties:
        role:
          type: string
          title: Role
          description: IAM role, e.g. roles/storage.admin
        members:
          items:
            type: string
          type: array
          title: Members
          description: Principals granted the role
      type: object
      required:
      - role
      - members
      title: IamBinding
      description: One role granted to a set of members on a resource.
    Resource:
      properties:
        full_name:
          type: string
          title: Full Name
          description: CAI full resource name, e.g. //storage.googleapis.com/buckets/my-bucket.
            This is the join key against IAM policy search.
        asset_type:
          type: string
          title: Asset Type
          description: CAI asset type, e.g. storage.googleapis.com/Bucket
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
          description: Short name of the resource
        project:
          anyOf:
          - type: string
          - type: 'null'
          title: Project
          description: Project NUMBER owning the resource, as CAI reports it
        project_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Project Id
          description: Human-readable project ID, derived from the parent resource
            path where CAI exposes it. None for resources whose parent is not a project.
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
          description: Region, zone, or multi-region
        state:
          anyOf:
          - type: string
          - type: 'null'
          title: State
          description: Resource state, where the type reports one
        labels:
          additionalProperties:
            type: string
          type: object
          title: Labels
          description: User-applied labels
        create_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Create Time
          description: Resource creation time
        parent_full_resource_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Full Resource Name
          description: Full resource name of the parent, where CAI reports one
        iam_bindings:
          anyOf:
          - items:
              $ref: '#/components/schemas/IamBinding'
            type: array
          - type: 'null'
          title: Iam Bindings
          description: IAM bindings ATTACHED to this resource, when include=iam was
            requested. None means IAM was not requested; an empty list means it was,
            and none are attached. Inherited bindings are NOT included -- see `iam_note`
            on the response envelope.
      type: object
      required:
      - full_name
      - asset_type
      title: Resource
      description: A single resource returned by Cloud Asset Inventory.
    ResourceList:
      properties:
        scope:
          type: string
          title: Scope
          description: Scope searched, e.g. projects/my-project
        asset_types:
          items:
            type: string
          type: array
          title: Asset Types
          description: CAI asset types that were searched
        query:
          type: string
          title: Query
          description: The Cloud Asset Inventory query the filters compiled to. Echoed
            back so a filter that compiles to something unintended is visible rather
            than silent.
        count:
          type: integer
          title: Count
          description: Number of resources in `data`
        truncated:
          type: boolean
          title: Truncated
          description: True when `limit` cut the result set short and more resources
            exist
        suppressed:
          type: integer
          title: Suppressed
          description: Resources hidden as low-signal. Always reported, never silently
            dropped; pass show_all=true to include them.
          default: 0
        suppressed_summary:
          type: string
          title: Suppressed Summary
          description: Human-readable explanation of what was hidden, and why
          default: ''
        iam_note:
          anyOf:
          - type: string
          - type: 'null'
          title: Iam Note
          description: Present when IAM was requested. States the semantics of what
            was returned, since attached-only bindings are easy to mistake for effective
            access.
        data:
          items:
            $ref: '#/components/schemas/Resource'
          type: array
          title: Data
      type: object
      required:
      - scope
      - asset_types
      - query
      - count
      - truncated
      - data
      title: ResourceList
      description: Envelope returned by a resource search.
    RiskSource:
      properties:
        title:
          type: string
          title: Title
        url:
          type: string
          title: Url
        quote:
          type: string
          title: Quote
          description: The passage the rule relies on
      type: object
      required:
      - title
      - url
      - quote
      title: RiskSource
      description: A published source a risk rule relies on, quoted so it can be checked.
    RiskyPermission:
      properties:
        permission:
          type: string
          title: Permission
          description: IAM permission, e.g. iam.serviceAccounts.actAs
        risk:
          type: string
          title: Risk
          description: high or medium
        reason:
          type: string
          title: Reason
          description: What a holder of this permission can do
        sources:
          items:
            type: string
          type: array
          title: Sources
          description: Ids of the sources supporting this rule
      type: object
      required:
      - permission
      - risk
      - reason
      - sources
      title: RiskyPermission
      description: One permission that makes a role risky, and why.
    RiskyRole:
      properties:
        name:
          type: string
          title: Name
          description: Role name, e.g. roles/owner
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
          description: Human-readable title
        stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Stage
          description: Launch stage, e.g. GA or DEPRECATED
        risk:
          type: string
          title: Risk
          description: Highest risk of any permission the role contains
        permissions:
          items:
            $ref: '#/components/schemas/RiskyPermission'
          type: array
          title: Permissions
          description: The risky permissions it contains
      type: object
      required:
      - name
      - risk
      - permissions
      title: RiskyRole
      description: An IAM role classified by the permissions it contains.
    RoleList:
      properties:
        min_risk:
          type: string
          title: Min Risk
          description: Lowest risk level included
        count:
          type: integer
          title: Count
          description: Number of roles in `data`
        suppressed:
          type: integer
          title: Suppressed
          description: Service-agent roles hidden by default; show_all=true includes
            them
          default: 0
        suppressed_summary:
          type: string
          title: Suppressed Summary
          description: What was hidden, and why
          default: ''
        data:
          items:
            $ref: '#/components/schemas/RiskyRole'
          type: array
          title: Data
        sources:
          additionalProperties:
            $ref: '#/components/schemas/RiskSource'
          type: object
          title: Sources
          description: Every source cited by the returned roles, keyed by id
      type: object
      required:
      - min_risk
      - count
      - data
      - sources
      title: RoleList
      description: Roles at or above a risk level.
    Summary:
      properties:
        scope:
          type: string
          title: Scope
          description: Scope summarised
        total:
          type: integer
          title: Total
          description: Resources counted, after noise reduction
        suppressed:
          type: integer
          title: Suppressed
          description: Resources hidden as low-signal
        by_asset_type:
          additionalProperties:
            type: integer
          type: object
          title: By Asset Type
          description: Counts per CAI asset type, descending
        by_project:
          additionalProperties:
            type: integer
          type: object
          title: By Project
          description: Counts per project, descending
        by_location:
          additionalProperties:
            type: integer
          type: object
          title: By Location
          description: Counts per location, descending
      type: object
      required:
      - scope
      - total
      - suppressed
      - by_asset_type
      - by_project
      - by_location
