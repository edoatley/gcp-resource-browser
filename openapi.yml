openapi: 3.1.0
info:
  title: GCP Resource Explorer API
  description: Search Google Cloud resources across a project, folder, or organization
    via Cloud Asset Inventory.
  version: 0.1.0
paths:
  /v1/resources:
    get:
      summary: Search resources in a scope
      operationId: search_resources_v1_resources_get
      parameters:
      - name: scope
        in: query
        required: true
        schema:
          type: string
          description: 'CAI scope: organizations/<id>, folders/<id>, or projects/<id>'
          examples:
          - projects/my-project
          title: Scope
        description: 'CAI scope: organizations/<id>, folders/<id>, or projects/<id>'
      - name: type
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: 'Resource type, repeatable. A friendly name, a raw CAI asset
            type, or an RE2 pattern. Friendly names: address, bucket, cloudrun, dataset,
            disk, firewall, forwardingrule, function, gke, network, project, secret,
            serviceaccount, spanner, sql, subnet, subscription, table, topic, vm.'
          examples:
          - - bucket
          title: Type
        description: 'Resource type, repeatable. A friendly name, a raw CAI asset
          type, or an RE2 pattern. Friendly names: address, bucket, cloudrun, dataset,
          disk, firewall, forwardingrule, function, gke, network, project, secret,
          serviceaccount, spanner, sql, subnet, subscription, table, topic, vm.'
      - name: q
        in: query
        required: false
        schema:
          type: string
          description: Free-text term, matched across all searchable fields
          default: ''
          title: Q
        description: Free-text term, matched across all searchable fields
      - name: label
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: 'Label filter, repeatable: `key=value`, or `key` to match any
            value'
          examples:
          - - env=prod
          title: Label
        description: 'Label filter, repeatable: `key=value`, or `key` to match any
          value'
      - name: location
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Location filter, repeatable; several are ORed. Supports `*`
            wildcards.
          examples:
          - - europe-west2
          title: Location
        description: Location filter, repeatable; several are ORed. Supports `*` wildcards.
      - name: project
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Project filter, repeatable; several are ORed. Accepts a project
            ID or number (IDs are resolved to numbers, which is what CAI matches on).
          title: Project
        description: Project filter, repeatable; several are ORed. Accepts a project
          ID or number (IDs are resolved to numbers, which is what CAI matches on).
      - name: raw_query
        in: query
        required: false
        schema:
          type: string
          description: Raw CAI query syntax, ANDed with the other filters
          default: ''
          title: Raw Query
        description: Raw CAI query syntax, ANDed with the other filters
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 10000
          minimum: 1
          description: Maximum resources to return
          default: 1000
          title: Limit
        description: Maximum resources to return
      - name: show_all
        in: query
        required: false
        schema:
          type: boolean
          description: Include resources hidden by default (enabled API services,
            image layers, auto-created default routes and subnets, and similar)
          default: false
          title: Show All
        description: Include resources hidden by default (enabled API services, image
          layers, auto-created default routes and subnets, and similar)
      - name: sort
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: 'Sort field, with optional ` DESC`. Repeatable for tie-breaks.
            One of: name, assetType, project, displayName, description, location,
            createTime, updateTime, state, parentFullResourceName, parentAssetType.'
          examples:
          - - name
          title: Sort
        description: 'Sort field, with optional ` DESC`. Repeatable for tie-breaks.
          One of: name, assetType, project, displayName, description, location, createTime,
          updateTime, state, parentFullResourceName, parentAssetType.'
      - name: include_iam
        in: query
        required: false
        schema:
          type: boolean
          description: Attach each resource's directly-attached IAM bindings. One
            extra call for the whole scope. Inherited bindings are not included unless
            effective is also set.
          default: false
          title: Include Iam
        description: Attach each resource's directly-attached IAM bindings. One extra
          call for the whole scope. Inherited bindings are not included unless effective
          is also set.
      - name: effective
        in: query
        required: false
        schema:
          type: boolean
          description: With IAM included, also attach the bindings each resource inherits
            from its ancestors, up to and including the scope, marked `inherited_from`.
            Grants made above the scope are not visible. One extra call per 20 resources.
            Requires include_iam=true.
          default: false
          title: Effective
        description: With IAM included, also attach the bindings each resource inherits
          from its ancestors, up to and including the scope, marked `inherited_from`.
          Grants made above the scope are not visible. One extra call per 20 resources.
          Requires include_iam=true.
      - name: cache_ttl
        in: query
        required: false
        schema:
          type: number
          maximum: 3600
          minimum: 0
          description: Seconds to cache identical searches. 0 (the default) disables
            it -- an audit tool should not answer from a stale cache unless asked
            to.
          default: 0.0
          title: Cache Ttl
        description: Seconds to cache identical searches. 0 (the default) disables
          it -- an audit tool should not answer from a stale cache unless asked to.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList'
        '400':
          description: Unknown type, malformed scope or filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller lacks Cloud Asset Viewer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Scope not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Cloud Asset Inventory call failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Cloud Asset API not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/resources/stream:
    get:
      summary: Stream resources as newline-delimited JSON
      description: 'One JSON object per line, emitted as CAI returns them.


        For result sets large enough that waiting for the whole payload is worse

        than parsing incrementally. Unlike `/v1/resources` this does not report

        suppression counts -- they are not known until the stream ends, and a

        trailer would be missed by most clients. Use `/v1/summary` for totals.'
      operationId: stream_resources_v1_resources_stream_get
      parameters:
      - name: scope
        in: query
        required: true
        schema:
          type: string
          description: 'CAI scope: organizations/<id>, folders/<id>, or projects/<id>'
          examples:
          - organizations/123
          title: Scope
        description: 'CAI scope: organizations/<id>, folders/<id>, or projects/<id>'
      - name: type
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Resource type, repeatable. A friendly name, a raw CAI asset
            type, or an RE2 pattern.
          title: Type
        description: Resource type, repeatable. A friendly name, a raw CAI asset type,
          or an RE2 pattern.
      - name: q
        in: query
        required: false
        schema:
          type: string
          description: Free-text term, matched across all searchable fields
          default: ''
          title: Q
        description: Free-text term, matched across all searchable fields
      - name: label
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: 'Label filter, repeatable: `key=value`, or `key` to match any
            value'
          title: Label
        description: 'Label filter, repeatable: `key=value`, or `key` to match any
          value'
      - name: location
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Location filter, repeatable; several are ORed. Supports `*`
            wildcards.
          title: Location
        description: Location filter, repeatable; several are ORed. Supports `*` wildcards.
      - name: project
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Project filter, repeatable; several are ORed. Accepts a project
            ID or number (IDs are resolved to numbers, which is what CAI matches on).
          title: Project
        description: Project filter, repeatable; several are ORed. Accepts a project
          ID or number (IDs are resolved to numbers, which is what CAI matches on).
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: Maximum resources to return
          title: Limit
        description: Maximum resources to return
      - name: show_all
        in: query
        required: false
        schema:
          type: boolean
          description: Include resources hidden by default (enabled API services,
            image layers, auto-created default routes and subnets, and similar)
          default: false
          title: Show All
        description: Include resources hidden by default (enabled API services, image
          layers, auto-created default routes and subnets, and similar)
      - name: sort
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: 'Sort field, with optional ` DESC`. Repeatable for tie-breaks.
            One of: name, assetType, project, displayName, description, location,
            createTime, updateTime, state, parentFullResourceName, parentAssetType.'
          title: Sort
        description: 'Sort field, with optional ` DESC`. Repeatable for tie-breaks.
          One of: name, assetType, project, displayName, description, location, createTime,
          updateTime, state, parentFullResourceName, parentAssetType.'
      responses:
        '200':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/summary:
