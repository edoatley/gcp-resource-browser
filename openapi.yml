      summary: Counts by type, project and location for a scope
      description: 'Aggregate a whole scope into one payload.


        No `limit`: a summary of a truncated result set would be a lie, so this

        always counts everything matching.'
      operationId: summary_v1_summary_get
      parameters:
      - name: scope
        in: query
        required: true
        schema:
          type: string
          description: 'CAI scope: organizations/<id>, folders/<id>, or projects/<id>'
          examples:
          - organizations/123
          title: Scope
        description: 'CAI scope: organizations/<id>, folders/<id>, or projects/<id>'
      - name: type
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Resource type, repeatable. A friendly name, a raw CAI asset
            type, or an RE2 pattern.
          title: Type
        description: Resource type, repeatable. A friendly name, a raw CAI asset type,
          or an RE2 pattern.
      - name: q
        in: query
        required: false
        schema:
          type: string
          description: Free-text term, matched across all searchable fields
          default: ''
          title: Q
        description: Free-text term, matched across all searchable fields
      - name: label
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: 'Label filter, repeatable: `key=value`, or `key` to match any
            value'
          title: Label
        description: 'Label filter, repeatable: `key=value`, or `key` to match any
          value'
      - name: location
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Location filter, repeatable; several are ORed. Supports `*`
            wildcards.
          title: Location
        description: Location filter, repeatable; several are ORed. Supports `*` wildcards.
      - name: project
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Project filter, repeatable; several are ORed. Accepts a project
            ID or number (IDs are resolved to numbers, which is what CAI matches on).
          title: Project
        description: Project filter, repeatable; several are ORed. Accepts a project
          ID or number (IDs are resolved to numbers, which is what CAI matches on).
      - name: show_all
        in: query
        required: false
        schema:
          type: boolean
          description: Include resources hidden by default (enabled API services,
            image layers, auto-created default routes and subnets, and similar)
          default: false
          title: Show All
        description: Include resources hidden by default (enabled API services, image
          layers, auto-created default routes and subnets, and similar)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
        '400':
          description: Unknown type, malformed scope or filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller lacks Cloud Asset Viewer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Scope not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Cloud Asset API not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/roles:
    get:
      summary: List IAM roles classed as risky
      description: 'Roles containing at least one permission at or above `risk`.


        Predefined roles always; pass `scope` to add the custom roles defined on

        that organization or project. A role''s risk is the highest risk of any

        permission it contains, so custom roles are classified on the same rules.

        Each permission carries its reason and source ids; `sources` quotes each

        source. Read `coverage_note` before treating the list as exhaustive.'
      operationId: list_roles_v1_roles_get
      parameters:
      - name: risk
        in: query
        required: false
        schema:
          type: string
          description: 'Lowest role risk to include: `high`, or `medium` for medium
            and high'
          examples:
          - high
          default: high
          title: Risk
        description: 'Lowest role risk to include: `high`, or `medium` for medium
          and high'
      - name: scope
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Also list the custom roles defined on this organization or
            project. Custom roles cannot be defined on a folder. Omit to list predefined
            roles only.
          examples:
          - organizations/123
          title: Scope
        description: Also list the custom roles defined on this organization or project.
          Custom roles cannot be defined on a folder. Omit to list predefined roles
          only.
      - name: show_all
        in: query
        required: false
        schema:
          type: boolean
          description: Include Google-managed service agents, hidden by default
          default: false
          title: Show All
        description: Include Google-managed service agents, hidden by default
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleList'
        '400':
          description: Unknown risk level, or a folder scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller cannot list roles on the scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Scope not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: IAM role listing failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: IAM API not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/grants:
    get:
      summary: Find principals holding risky roles
      description: 'Every principal holding a role at or above `role_risk`, matched
        by permission.


        Read `coverage_note`: a project or folder scope cannot see grants made

        above it, billing account IAM is not included, and groups are not expanded.'
      operationId: list_grants_v1_grants_get
      parameters:
      - name: scope
        in: query
        required: true
        schema:
          type: string
          description: 'CAI scope: organizations/<id>, folders/<id>, or projects/<id>'
          examples:
          - organizations/123
          title: Scope
        description: 'CAI scope: organizations/<id>, folders/<id>, or projects/<id>'
      - name: role_risk
        in: query
        required: false
        schema:
          type: string
          description: 'Lowest role risk to include: `high`, or `medium` for medium
            and high'
          examples:
          - high
          default: high
          title: Role Risk
        description: 'Lowest role risk to include: `high`, or `medium` for medium
          and high'
      - name: member_type
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: 'Principal type to include, repeatable: user, group, serviceAccount,
            domain, allUsers, allAuthenticatedUsers, principal, principalSet. Omit
            for all.'
          examples:
          - - user
            - group
          title: Member Type
        description: 'Principal type to include, repeatable: user, group, serviceAccount,
          domain, allUsers, allAuthenticatedUsers, principal, principalSet. Omit for
          all.'
      - name: group_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Roll grants up by `member` (who holds what) or `role` (who
            holds each role)
          examples:
          - member
          title: Group By
        description: Roll grants up by `member` (who holds what) or `role` (who holds
          each role)
      - name: show_all
        in: query
        required: false
        schema:
          type: boolean
          description: Include Google-managed service agents, hidden by default
          default: false
          title: Show All
        description: Include Google-managed service agents, hidden by default
      - name: expand_members
        in: query
        required: false
        schema:
          type: boolean
          description: 'Show who is behind members that stand for other principals:
            a group (via Cloud Identity), or projectOwner/Editor/Viewer (from that
            project''s attached policy). Off by default, because it lists named people.'
          default: false
          title: Expand Members
        description: 'Show who is behind members that stand for other principals:
          a group (via Cloud Identity), or projectOwner/Editor/Viewer (from that project''s
          attached policy). Off by default, because it lists named people.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 10000
          minimum: 1
          description: Maximum resources to return
          default: 1000
          title: Limit
        description: Maximum resources to return
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantList'
        '400':
          description: Bad scope, risk, member type or group_by
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller lacks Cloud Asset Viewer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Scope not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Cloud Asset Inventory call failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Cloud Asset API not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/billing-grants:
    get:
      summary: Find principals holding risky roles on billing accounts
      description: 'Principals holding risky roles on a billing account.


        There is no `scope`: Cloud Asset Inventory does not index billing accounts

        and `billingAccounts/...` is not a valid CAI scope, so this reads the Cloud

        Billing API directly and covers every account the caller can see. Read

        `coverage_note` and `unclassified_roles`.'
      operationId: list_billing_grants_v1_billing_grants_get
      parameters:
      - name: role_risk
        in: query
        required: false
        schema:
          type: string
          description: 'Lowest role risk to include: `high`, or `medium` for medium
            and high'
          examples:
          - high
          default: high
          title: Role Risk
        description: 'Lowest role risk to include: `high`, or `medium` for medium
          and high'
      - name: member_type
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: 'Principal type to include, repeatable: user, group, serviceAccount,
            domain, allUsers, allAuthenticatedUsers, principal, principalSet. Omit
            for all.'
          examples:
          - - user
            - group
          title: Member Type
        description: 'Principal type to include, repeatable: user, group, serviceAccount,
          domain, allUsers, allAuthenticatedUsers, principal, principalSet. Omit for
          all.'
      - name: group_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Roll grants up by `member` (who holds what) or `role` (who
            holds each role)
          examples:
          - member
          title: Group By
        description: Roll grants up by `member` (who holds what) or `role` (who holds
          each role)
      - name: show_all
        in: query
        required: false
        schema:
          type: boolean
          description: Include Google-managed service agents, hidden by default
          default: false
          title: Show All
        description: Include Google-managed service agents, hidden by default
      - name: expand_members
        in: query
        required: false
        schema:
          type: boolean
          description: 'Show who is behind members that stand for other principals:
            a group (via Cloud Identity), or projectOwner/Editor/Viewer (from that
            project''s attached policy). Off by default, because it lists named people.'
          default: false
          title: Expand Members
        description: 'Show who is behind members that stand for other principals:
          a group (via Cloud Identity), or projectOwner/Editor/Viewer (from that project''s
          attached policy). Off by default, because it lists named people.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 10000
          minimum: 1
          description: Maximum resources to return
          default: 1000
          title: Limit
        description: Maximum resources to return
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingGrantList'
        '400':
          description: Bad risk, member type or group_by
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller lacks Billing Account Viewer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Cloud Billing API call failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Cloud Billing API not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/types:
    get:
      summary: List supported resource-type names
      description: 'Friendly names mapped to CAI asset types.


        Raw CAI asset types are accepted anywhere a friendly name is, so this is a

        convenience listing rather than the set of what can be searched.'
      operationId: list_types_v1_types_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response List Types V1 Types Get
components:
  schemas:
    BillingGrantList:
      properties:
        min_risk:
          type: string
          title: Min Risk
          description: Lowest role risk included
        member_types:
          items:
            type: string
          type: array
          title: Member Types
          description: Member types searched; empty means all
        accounts:
          items:
            type: string
          type: array
          title: Accounts
          description: Billing accounts read, by resource name. One getIamPolicy call
            each.
        count:
          type: integer
          title: Count
        truncated:
          type: boolean
          title: Truncated
        suppressed:
          type: integer
          title: Suppressed
          description: Service-agent grants hidden by default; show_all=true includes
            them
          default: 0
        suppressed_summary:
          type: string
          title: Suppressed Summary
          default: ''
        unclassified_roles:
          items:
            type: string
          type: array
          title: Unclassified Roles
          description: Roles granted on a billing account whose permissions are not
            in the predefined catalogue, usually custom roles. Reported rather than
            assumed safe.
        coverage_note:
          type: string
          title: Coverage Note
          description: What this search cannot see. Read it before treating the list
            as complete.
        grants:
          items:
            $ref: '#/components/schemas/Grant'
          type: array
          title: Grants
        groups:
          anyOf:
          - items:
              $ref: '#/components/schemas/GrantGroup'
            type: array
          - type: 'null'
          title: Groups
          description: Present when group_by was requested
        expansions:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/MemberExpansion'
            type: object
          - type: 'null'
          title: Expansions
          description: 'Present when expand_members was requested: each member in
            the results that stands for other principals, and who those are'
      type: object
      required:
      - min_risk
      - member_types
      - accounts
      - count
      - truncated
      - coverage_note
      - grants
      title: BillingGrantList
      description: 'Envelope returned by a billing-account grant search.


        Separate from `GrantList` rather than a `scope="billingAccounts"` variant

        of it: there is no scope and there are no CAI queries, so every field that

        would have to be faked is simply absent, and what is specific to billing

        (which accounts were read, which roles could not be classified) is present.'
    ErrorResponse:
      properties:
        error:
          type: string
          title: Error
          description: Machine-readable error code
        detail:
          type: string
          title: Detail
          description: Human-readable explanation
      type: object
      required:
      - error
      - detail
      title: ErrorResponse
      description: Body returned with any non-2xx status.
    Grant:
      properties:
        resource:
          type: string
          title: Resource
          description: Full resource name the policy is attached to
        asset_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Asset Type
          description: CAI asset type of that resource
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
          description: Human-readable name of the resource, when the source reports
            one
        role:
          type: string
          title: Role
          description: Role granted
        member:
          type: string
          title: Member
          description: Principal, e.g. user:a@example.com or group:ops@example.com
        member_type:
          type: string
          title: Member Type
          description: user, group, serviceAccount, domain, allUsers, ...
        risk:
          type: string
          title: Risk
          description: Highest risk among the matched permissions
        matched_permissions:
          items:
            type: string
          type: array
          title: Matched Permissions
          description: Risky permissions in this role that the search matched
        condition:
          anyOf:
          - type: string
          - type: 'null'
          title: Condition
          description: IAM condition expression, when the binding is conditional
        member_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Member Count
          description: How many principals the member stands for, when expand_members
            was requested and it could be read. Names are in the response's `expansions`.
      type: object
      required:
      - resource
      - role
      - member
      - member_type
      - risk
      - matched_permissions
      title: Grant
      description: One principal holding one risky role on one resource.
    GrantGroup:
      properties:
        key:
          type: string
          title: Key
          description: The member or role grouped on
        highest_risk:
          type: string
          title: Highest Risk
        grant_count:
          type: integer
          title: Grant Count
        resource_count:
          type: integer
          title: Resource Count
          description: Distinct resources involved
        roles:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Roles
          description: Roles held (grouping by member)
        members:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Members
          description: Holders (grouping by role)
      type: object
      required:
      - key
      - highest_risk
      - grant_count
      - resource_count
      title: GrantGroup
      description: Grants rolled up by member or by role, for an over-permissioning
        review.
    GrantList:
      properties:
        scope:
          type: string
          title: Scope
        min_risk:
          type: string
          title: Min Risk
          description: Lowest role risk included
        member_types:
          items:
            type: string
          type: array
          title: Member Types
          description: Member types searched; empty means all
        queries:
          items:
            type: string
          type: array
          title: Queries
          description: The CAI queries sent, one per batch of permissions. CAI caps
            the alternations in a single query, so a long permission list is searched
            in batches.
        count:
          type: integer
          title: Count
        truncated:
          type: boolean
          title: Truncated
        suppressed:
          type: integer
          title: Suppressed
          description: Service-agent grants hidden by default; show_all=true includes
            them
          default: 0
        suppressed_summary:
          type: string
          title: Suppressed Summary
          default: ''
        coverage_note:
          type: string
          title: Coverage Note
          description: What this search cannot see. Read it before treating the list
            as complete.
        grants:
          items:
            $ref: '#/components/schemas/Grant'
          type: array
          title: Grants
        groups:
          anyOf:
          - items:
              $ref: '#/components/schemas/GrantGroup'
            type: array
          - type: 'null'
          title: Groups
          description: Present when group_by was requested
        expansions:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/MemberExpansion'
            type: object
          - type: 'null'
          title: Expansions
          description: 'Present when expand_members was requested: each member in
            the results that stands for other principals, and who those are'
      type: object
      required:
      - scope
      - min_risk
      - member_types
      - queries
      - count
      - truncated
      - coverage_note
      - grants
      title: GrantList
      description: Envelope returned by a high-risk grant search.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IamBinding:
      properties:
        role:
          type: string
          title: Role
          description: IAM role, e.g. roles/storage.admin
        members:
          items:
            type: string
          type: array
          title: Members
          description: Principals granted the role
        inherited_from:
          anyOf:
          - type: string
          - type: 'null'
          title: Inherited From
          description: Full resource name of the ancestor this binding is attached
            to, when it is inherited rather than attached to the resource itself.
            Only present when `effective` was requested.
      type: object
      required:
      - role
      - members
      title: IamBinding
      description: One role granted to a set of members on a resource.
    MemberExpansion:
      properties:
        kind:
          type: string
          title: Kind
          description: group, projectOwner, projectEditor, projectViewer, ...
        members:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Members
          description: The principals it stands for; [] means read and empty, null
            means not read
        count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Count
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
          description: What the member means, when it cannot be listed
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
          description: Why it could not be read
      type: object
      required:
      - kind
      title: MemberExpansion
      description: Who is behind one member that stands for other principals.
    Resource:
      properties:
        full_name:
          type: string
          title: Full Name
          description: CAI full resource name, e.g. //storage.googleapis.com/buckets/my-bucket.
            This is the join key against IAM policy search.
        asset_type:
          type: string
          title: Asset Type
          description: CAI asset type, e.g. storage.googleapis.com/Bucket
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
          description: Short name of the resource
        project:
          anyOf:
          - type: string
          - type: 'null'
          title: Project
          description: Project NUMBER owning the resource, as CAI reports it
        project_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Project Id
          description: Human-readable project ID, derived from the parent resource
            path where CAI exposes it. None for resources whose parent is not a project.
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
          description: Region, zone, or multi-region
        state:
          anyOf:
          - type: string
          - type: 'null'
          title: State
          description: Resource state, where the type reports one
        labels:
          additionalProperties:
            type: string
          type: object
          title: Labels
          description: User-applied labels
        create_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Create Time
          description: Resource creation time
        parent_full_resource_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Full Resource Name
          description: Full resource name of the parent, where CAI reports one
        iam_bindings:
          anyOf:
          - items:
              $ref: '#/components/schemas/IamBinding'
            type: array
          - type: 'null'
          title: Iam Bindings
          description: IAM bindings ATTACHED to this resource, when include=iam was
            requested. None means IAM was not requested; an empty list means it was,
            and none are attached. Inherited bindings are included only when `effective`
            was requested, and then carry `inherited_from` -- see `iam_note` on the
            response envelope.
      type: object
      required:
      - full_name
      - asset_type
      title: Resource
      description: A single resource returned by Cloud Asset Inventory.
    ResourceList:
      properties:
        scope:
          type: string
          title: Scope
          description: Scope searched, e.g. projects/my-project
        asset_types:
          items:
            type: string
          type: array
          title: Asset Types
          description: CAI asset types that were searched
        query:
          type: string
          title: Query
          description: The Cloud Asset Inventory query the filters compiled to. Echoed
            back so a filter that compiles to something unintended is visible rather
            than silent.
        count:
          type: integer
          title: Count
          description: Number of resources in `data`
        truncated:
          type: boolean
          title: Truncated
          description: True when `limit` cut the result set short and more resources
            exist
        suppressed:
          type: integer
          title: Suppressed
          description: Resources hidden as low-signal. Always reported, never silently
            dropped; pass show_all=true to include them.
          default: 0
        suppressed_summary:
          type: string
          title: Suppressed Summary
          description: Human-readable explanation of what was hidden, and why
          default: ''
        iam_note:
          anyOf:
          - type: string
          - type: 'null'
          title: Iam Note
          description: Present when IAM was requested. States the semantics of what
            was returned, since attached-only bindings are easy to mistake for effective
            access.
        iam_errors:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Iam Errors
          description: 'Present when `effective` was requested: resource -> why its
            inherited bindings could not be read. Those resources show attached bindings
            only. Empty means every resource was read.'
        data:
          items:
            $ref: '#/components/schemas/Resource'
          type: array
          title: Data
      type: object
      required:
      - scope
      - asset_types
      - query
      - count
      - truncated
      - data
      title: ResourceList
      description: Envelope returned by a resource search.
    RiskSource:
      properties:
        title:
          type: string
          title: Title
        url:
          type: string
          title: Url
        quote:
          type: string
          title: Quote
          description: The passage the rule relies on
      type: object
      required:
      - title
      - url
      - quote
      title: RiskSource
      description: A published source a risk rule relies on, quoted so it can be checked.
    RiskyPermission:
      properties:
        permission:
          type: string
          title: Permission
          description: IAM permission, e.g. iam.serviceAccounts.actAs
        risk:
          type: string
          title: Risk
          description: high or medium
        reason:
          type: string
          title: Reason
          description: What a holder of this permission can do
        sources:
          items:
            type: string
          type: array
          title: Sources
          description: Ids of the sources supporting this rule
      type: object
      required:
      - permission
      - risk
      - reason
      - sources
      title: RiskyPermission
      description: One permission that makes a role risky, and why.
    RiskyRole:
      properties:
        name:
          type: string
          title: Name
          description: Role name, e.g. roles/owner
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
          description: Human-readable title
        stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Stage
          description: Launch stage, e.g. GA or DEPRECATED
        risk:
          type: string
          title: Risk
          description: Highest risk of any permission the role contains
        permissions:
          items:
            $ref: '#/components/schemas/RiskyPermission'
          type: array
          title: Permissions
          description: The risky permissions it contains
        custom:
          type: boolean
          title: Custom
          description: True for a custom role defined on the requested scope, false
            for predefined
          default: false
      type: object
      required:
      - name
      - risk
      - permissions
      title: RiskyRole
      description: An IAM role classified by the permissions it contains.
    RoleList:
      properties:
        min_risk:
          type: string
          title: Min Risk
          description: Lowest risk level included
        scope:
          anyOf:
          - type: string
          - type: 'null'
          title: Scope
          description: Scope whose custom roles were included, if one was given
        coverage_note:
          type: string
          title: Coverage Note
          description: Which roles this listing could and could not see. Read before
            trusting it.
          default: ''
        count:
          type: integer
          title: Count
          description: Number of roles in `data`
        suppressed:
          type: integer
          title: Suppressed
          description: Service-agent roles hidden by default; show_all=true includes
            them
          default: 0
        suppressed_summary:
          type: string
          title: Suppressed Summary
          description: What was hidden, and why
          default: ''
        data:
          items:
            $ref: '#/components/schemas/RiskyRole'
          type: array
          title: Data
        sources:
          additionalProperties:
            $ref: '#/components/schemas/RiskSource'
          type: object
          title: Sources
          description: Every source cited by the returned roles, keyed by id
      type: object
      required:
      - min_risk
      - count
      - data
      - sources
      title: RoleList
      description: Roles at or above a risk level.
    Summary:
      properties:
        scope:
          type: string
          title: Scope
          description: Scope summarised
        total:
          type: integer
          title: Total
          description: Resources counted, after noise reduction
        suppressed:
          type: integer
          title: Suppressed
          description: Resources hidden as low-signal
        by_asset_type:
          additionalProperties:
            type: integer
          type: object
          title: By Asset Type
          description: Counts per CAI asset type, descending
        by_project:
          additionalProperties:
            type: integer
          type: object
          title: By Project
          description: Counts per project, descending
        by_location:
          additionalProperties:
            type: integer
          type: object
          title: By Location
          description: Counts per location, descending
      type: object
      required:
      - scope
      - total
      - suppressed
      - by_asset_type
      - by_project
      - by_location
      title: Summary
      description: Aggregated counts for a scope, in one round trip.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
