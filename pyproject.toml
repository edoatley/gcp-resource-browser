[project]
name = "gcp-resource-browser"
version = "0.1.0"
description = "GCP Resource Explorer API and CLI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "google-cloud-asset",
    "pydantic",
    "pyyaml>=6.0.3",
    "rich",
    "typer",
    "uvicorn",
]

[project.scripts]
# This allows you to run the CLI globally via `uv run gcp-explorer`
gcp-explorer = "app.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Code lives in app/, which does not match the project name, so name it explicitly.
packages = ["app"]
[dependency-groups]
dev = [
    "pytest",
    "httpx2",     # required by starlette.testclient (supersedes httpx)
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Calls in argument defaults are the intended idiom for both frameworks:
# FastAPI reads them to build the OpenAPI schema, Typer to build the CLI.
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Depends",
    "typer.Argument",
    "typer.Option",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
